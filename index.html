<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrader - Crypto Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230b0e14%22/><path d=%22M25 65 L25 45 M20 50 L30 50 M50 75 L50 25 M44 40 L56 40 M75 55 L75 35 M70 42 L80 42%22 stroke=%22%2310b981%22 stroke-width=%228%22 stroke-linecap=%22round%22/></svg>">
</head>

<body>

    <header class="top-nav">
        <div class="brand-wrap">
            <h2 class="brand-logo">ApexTrader</h2>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link active">Market</a>
                <a href="trade.html" class="nav-link">Trade</a>
                <a href="portfolio.html" class="nav-link">Portfolio</a>
            </nav>
        </div>
        <div class="user-wallet">
            <span class="wallet-txt">Cash Balance:</span>
            <strong id="userCashBal">$10,000.00</strong>
        </div>
    </header>

    <main class="page-body">

        <section class="overview-cards">
            <div class="card" id="mcapCard">
                <span class="card-label">Global Market Cap</span>
                <section class="card-row">
                    <h3 class="card-num" id="totalMcap">Loading...</h3>
                    <span class="tag green" id="mcapPct">+0.0%</span>
                </section>
            </div>

            <div class="card" id="gainerCard">
                <span class="card-label">Top 24h Gainer</span>
                <section class="card-row">
                    <h3 class="card-num" id="gainerName">--</h3>
                    <span class="tag green" id="gainerPct">+0.0%</span>
                </section>
                <span class="sub-txt" id="gainerPrice">$0.00</span>
            </div>

            <div class="card" id="loserCard">
                <span class="card-label">Top 24h Loser</span>
                <section class="card-row">
                    <h3 class="card-num" id="loserName">--</h3>
                    <span class="tag red" id="loserPct">-0.0%</span>
                </section>
                <span class="sub-txt" id="loserPrice">$0.00</span>
            </div>
        </section>

        <section class="filter-bar">
            <div class="search-field">
                <input type="text" id="searchInput" placeholder="🔍 Search coin name or symbol (e.g. BTC, Solana)...">
            </div>
            <div class="tab-btns">
                <button class="tab-btn active" data-filter="all">All</button>
                <button class="tab-btn" data-filter="top10">Top 10</button>
                <button class="tab-btn" data-filter="gainers">Gainers</button>
                <button class="tab-btn" data-filter="losers">Losers</button>
            </div>
        </section>

        <section class="data-table-wrapper">
            <table class="coins-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Asset</th>
                        <th>Price</th>
                        <th>24h Change</th>
                        <th>24h Range</th>
                        <th>Market Cap</th>
                        <th>Trade</th>
                    </tr>
                </thead>
                <tbody id="coinsList">
                </tbody>
            </table>
        </section>

    </main>

    <footer class="app-footer">
        <p>Market data powered by CoinGecko API</p>
    </footer>

    <script type="module" src="js/market.js"></script>
</body>

</html>
